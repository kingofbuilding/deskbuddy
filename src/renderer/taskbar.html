<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';img-src 'self';connect-src 'none';base-uri 'none';form-action 'none'">
<title>鱼鱼桌宠</title><link rel="stylesheet" href="taskbar.css"></head><body>
<header><img src="assets/tray.png" alt=""><div><h1>鱼鱼在这里呀</h1><p>任务栏的小蓝鲸，就是我的入口。</p></div></header>
<button id="recover" class="primary">找回鱼鱼 · 恢复大小和位置</button>
<div class="row"><button data-panel="tasks">今日任务</button><button data-panel="settings">提醒与设置</button><button data-panel="companion">聊聊天</button></div>
<p class="hint">Ctrl + Alt + P 也能找回。关闭这个小窗会收回任务栏。</p>
<footer><button id="hide">收起桌宠</button><button id="quit">退出鱼鱼</button></footer>
<script src="taskbar.js"></script></body></html>
